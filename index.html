<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            font-family: 'Roboto', sans-serif;
            background:
                radial-gradient(ellipse at 10% 85%,
                    #0077c8 0%,
                    transparent 30%),
                radial-gradient(ellipse at 0% 30%,
                    #182b69 0%,
                    transparent 25%),
                radial-gradient(ellipse at 100% 100%,
                    #37104f 0%,
                    transparent 40%),
                #1b123f;
            color: white;
        }
        .registration-container {
            width: 100%;
            max-width: 1000px;
            padding: 40px 55px 60px;
            border: 3px solid rgba(170, 170, 200, 0.35);
            border-radius: 40px;
            background: rgba(55, 43, 85, 0.65);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 80px;
        }
        .header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .header p {
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            font-weight: 500;
            color: #e4e0ef;
        }
        .registration-form {
            width: 100%;
        }
        .form-group {
            margin-bottom: 40px;
        }
        .form-group label {
            display: block;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 25px;
        }
        .input-box {
            position: relative;
            width: 100%;
        }
        .input-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #8880a5;
            font-size: 22px;
        }
        .input-box input {
            width: 100%;
            height: 45px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #aaa5bd;
            outline: none;
            color: white;
            font-size: 17px;
            padding: 10px 15px 10px 45px;
            transition: 0.3s;
        }
        .input-box input:focus {
            border-bottom-color: #ec1682;
        }
        .name-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .name-fields input {
            width: 100%;
            height: 45px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #aaa5bd;
            outline: none;
            color: white;
            font-size: 17px;
            padding: 10px;
        }
        .name-fields input:focus {
            border-bottom-color: #ec1682;
        }
        .name-fields input::placeholder {
            color: transparent;
        }
        .name-fields span {
            display: block;
            margin-top: 12px;
            font-size: 15px;
            color: #e3dfed;
        }
        select {
            width: 100%;
            height: 55px;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #aaa5bd;
            outline: none;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }
        select:focus {
            border-bottom-color: #ec1682;
        }
        select option {
            background: #30234d;
            color: white;
        }
        .button-container {
            text-align: center;
            margin-top: 60px;
        }
        button {
            width: 210px;
            height: 62px;
            border: none;
            border-radius: 40px;
            background: #d41473;
            color: white;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #f12691;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 20, 115, 0.3);
        }
        button:active {
            transform: scale(0.97);
        }
        #success-message {
            display: none;
            margin-top: 25px;
            text-align: center;
            color: #70ffb2;
            font-size: 16px;
        }
        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
            }
            .registration-container {
                padding: 35px 25px;
                border-radius: 25px;
            }
            .header {
                margin-bottom: 50px;
            }
            .header h1 {
                font-size: 28px;
            }
            .header p {
                font-size: 16px;
            }
            .form-group label {
                font-size: 18px;
            }
            .name-fields {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .name-fields span {
                font-size: 14px;
            }
            button {
                width: 180px;
                height: 55px;
                font-size: 18px;
            }
        }
        @media (max-width: 400px) {
            .registration-container {
                padding: 30px 18px;
            }
            .header h1 {

                font-size: 25px;
            }
            .header p {

                font-size: 14px;
            }
            .input-box input {

                font-size: 15px;
            }
            select {

                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="registration-container">
        <div class="header">
            <h1>Event Registration</h1>
            <p>Register with us to get more details.</p>
        </div>
        <form class="registration-form" id="registrationForm">
            <div class="form-group">
                <label>Name</label>
                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <div class="name-fields">
                        <div>
                            <input type="text" id="firstName" placeholder="First Name" required>
                            <span>First</span>
                        </div>
                        <div>
                            <input type="text" id="lastName" placeholder="Last Name" required>
                            <span>Last</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <div class="input-box">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <input type="tel" id="phone" placeholder="Enter your phone number" pattern="[0-9]{10}"
                        maxlength="10" required>
                </div>
            </div>
            <div class="form-group">
                <label for="topic">Topic</label>
                <select id="topic" required>
                    <option value="" selected disabled>
                        Select Topic
                    </option>
                    <option value="Web Development">
                        Web Development
                    </option>
                    <option value="Python Programming">
                        Python Programming
                    </option>
                    <option value="Artificial Intelligence">
                        Artificial Intelligence
                    </option>
                    <option value="Machine Learning">
                        Machine Learning
                    </option>
                    <option value="Data Science">
                        Data Science
                    </option>
                    <option value="Full Stack Development">
                        Full Stack Development
                    </option>
                </select>
            </div>
            <div class="form-group">
                <label for="slot">Preferred Slot</label>
                <select id="slot" required>
                    <option value="" selected disabled>
                        Select Preferred Slot
                    </option>
                    <option value="Morning">
                        Morning - 9 AM to 12 PM
                    </option>
                    <option value="Afternoon">
                        Afternoon - 1 PM to 4 PM
                    </option>
                    <option value="Evening">
                        Evening - 5 PM to 8 PM
                    </option>
                </select>
            </div>
            <div class="button-container">

                <button type="submit">
                    Sign me up
                </button>
            </div>
            <p id="success-message">
                Registration completed successfully!
            </p>
        </form>
    </div>
    <script>
        const form = document.getElementById("registrationForm");
        const successMessage = document.getElementById("success-message");
        form.addEventListener("submit", function (event) {
            event.preventDefault();
            const firstName = document.getElementById("firstName").value;
            const lastName = document.getElementById("lastName").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const topic = document.getElementById("topic").value;
            const slot = document.getElementById("slot").value;
            successMessage.style.display = "block";
            successMessage.textContent =
                "Thank you " + firstName + " " + lastName +
                "! Your registration is successful.";
            console.log("Registration Details");
            console.log("First Name:", firstName);
            console.log("Last Name:", lastName);
            console.log("Email:", email);
            console.log("Phone:", phone);
            console.log("Topic:", topic);
            console.log("Preferred Slot:", slot);
            form.reset();
        });
    </script>
</body>
</html>
